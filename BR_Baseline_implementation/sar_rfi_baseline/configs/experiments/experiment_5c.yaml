# Experiment 5C: Domain Shift Condition (Paper Section 5.3)
# Objective: Robustness assessment under distribution shifts where interference modulation parameters differ significantly between training and testing.

experiment:
  id: "5c"
  name: "Domain Shift Condition"
  paper_section: "Section 5.3 (Pages 18-19)"
  replication_status: "APPROXIMATION (Executable via validated disjoint parameter sets; exact paper parameters withheld)"

dataset:
  clean_scenes_path: "data/clean_scenes"           # Extracted clean SAR images from local RFI-Patch or lab slices
  scene_split_file: "outputs/splits/exp3_split.json"
  split_identifiers:
    train_split: "train"                           # 80% scene holdout
    val_split: "val"                               # 10% scene holdout
    test_split: "test"                             # 10% scene holdout
  split_policy: "Scene-level holdout with disjoint synthetic interference parameter sets"

domain_shift_parameters:
  documentation_note: "Paper Section 5.3 describes testing under inconsistent interference parameters and modulation modes but withholds all numerical intervals. Repository defines engineering proxy sets."
  train_distribution:
    name: "exp3_train"
    modulation: "chirp_wideband"
    bandwidth_mhz: [20.0, 50.0]
    pulse_width_us: [40.0, 100.0]
    chirp_rate_abs_hz_s: [2.0e11, 1.25e12]
  test_distribution:
    name: "exp3_test"
    modulation: "chirp_wideband + sinusoidal + multi-tone"
    bandwidth_mhz: [60.0, 100.0]                    # Non-overlapping bandwidth
    pulse_width_us: [5.0, 20.0]                     # Non-overlapping pulse duration
    chirp_rate_abs_hz_s: [3.0e12, 2.0e13]          # Non-overlapping chirp rates

models:
  evaluated:
    - "dncnn"
    - "pisnet"
    - "unet"
    - "fdnet"
  in_channels: 2
  out_channels: 2

dimensions:
  raw_image_shape: [512, 1500]
  stft_window_length: 187
  stft_hop_length: 46
  stft_spectrogram_shape: [2, 187, 33]

training:
  batch_size: 4                                    # Section 4.3
  epochs: 100                                      # Section 4.3
  optimizer: "adamw"                               # Section 4.3
  lr: 0.0002                                       # Section 4.3
  weight_decay: 0.01                               # Section 4.3
  lr_scheduler: null
  loss: "auto"
  seed: 42
  sir_settings:
    train_sir_db: [-20.0]                          # Section 5.3 trains at -20 dB SIR
    test_sir_db: [0.0, -10.0, -20.0, -30.0]        # Section 5.3 evaluates at four SIR levels

evaluation:
  metrics:
    - "psnr"                                       # Eq. 23
    - "ssim"                                       # Eq. 24
  quantize_8bit: true
  save_plots: true                                 # Figure 12 (Domain shift PSNR and SSIM curves)
  save_visualizations: true                        # Figure 13 (SAR images at -20 dB under domain shift)
  target_results_figure_12_approx:
    sir_0db:
      psnr: "> 30 dB"
      ssim: "> 0.90"
    sir_minus10db:
      psnr: "> 30 dB"
      ssim: "approaches or exceeds 0.90"
    sir_minus20db:
      psnr: "< 25 dB (sharp collapse; all models perform similarly)"
      ssim: "severe drop"
    sir_minus30db:
      psnr: "< 20 dB"
      ssim: "severe drop"

output:
  output_dir: "outputs/experiments/exp_5c"
  checkpoints_dir: "outputs/runs/exp_5c"
