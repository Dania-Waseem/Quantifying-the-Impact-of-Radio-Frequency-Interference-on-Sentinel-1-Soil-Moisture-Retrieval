# Experiment 5A: Open-Source Data from Sentinel-1 (Paper Section 5.1)
# Objective: Generalization test of models trained on laboratory-constructed RFI data to real Sentinel-1 SAR interference.

experiment:
  id: "5a"
  name: "Sentinel-1 Generalization"
  paper_section: "Section 5.1 (Pages 15-16)"
  replication_status: "BLOCKED (Missing Data: 0/640 laboratory slices, 12/30 Sentinel-1 slices available locally)"

dataset:
  train_data_path: "data/lab_mat"                  # Full 640 laboratory slices from Baidu Netdisk (Missing locally)
  local_proxy_train_path: "Data/RFI-Patch/RFI-1"   # Local 16-stack subset available for proxy verification
  test_data_path: "data/sentinel1"                 # Paper requires 30 slices across 4 scenarios
  local_test_data_path: "Data"                     # Local disk has 12 slices across Scenarios 1-3
  scene_split_file: "outputs/splits/exp1_split.json"
  split_identifiers:
    train_split: "train"
    val_split: "val"
    test_split: "sentinel1_unlabeled"
  split_policy: "Scene-level holdout (80% train, 10% val, 10% test); Sentinel-1 slices are unlabeled"

models:
  evaluated:
    - "dncnn"
    - "pisnet"
    - "unet"
    - "fdnet"
  in_channels: 2
  out_channels: 2

dimensions:
  raw_image_shape: [512, 1500]                     # Scenario 1 is [512, 1536]; Scenarios 2-3 are [512, 1500]
  stft_window_length: 187                          # L // 8 = 187 (Section 4.1)
  stft_hop_length: 46                              # L // 32 = 46 (75% COLA overlap, reasonable implementation choice)
  stft_spectrogram_shape: [2, 187, 33]             # [real/imag, frequency bins, time bins]

training:
  batch_size: 4                                    # Section 4.3 (uniformly applied across all models)
  epochs: 100                                      # Section 4.3
  optimizer: "adamw"                               # Section 4.3
  lr: 0.0002                                       # Section 4.3 (FDNet official code used 0.002)
  weight_decay: 0.01                               # Section 4.3 / official options.py
  lr_scheduler: null                               # Section 4.3 specifies initial lr; FDNet code used StepLR(50, 0.5)
  loss: "auto"                                     # "mse" for dncnn/pisnet/unet; "fdnet" (Charbonnier + cosine decomp) for fdnet
  seed: 42                                         # Default seed (unstated in paper)
  sir_settings:
    train_sir_db: [-30.0, -20.0, -10.0, 0.0]       # Section 5.1 trains on all laboratory constructed data
    test_sir_db: null                              # Real-world Sentinel-1 data has unknown RFI power

evaluation:
  metric: "mean_entropy"                           # Eq. 25: ME = Ent(X) * Mean(X) (unlabeled Sentinel-1 data)
  quantize_8bit: false                             # Continuous float64 evaluation per paper definition
  save_figures: true                               # Figures 7 and 8 (Spectrograms and SAR magnitude panels)
  target_results_table_3:
    polluted_me: 0.314
    dncnn_me: 0.068
    pisnet_me: 0.067
    unet_me: 0.066
    fdnet_me: 0.064

output:
  output_dir: "outputs/experiments/exp_5a"
  checkpoints_dir: "outputs/runs/exp_5a"
