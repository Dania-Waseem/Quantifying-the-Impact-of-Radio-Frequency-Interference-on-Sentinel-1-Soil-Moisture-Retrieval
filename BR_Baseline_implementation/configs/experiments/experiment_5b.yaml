# Experiment 5B: Same Data Distribution (Paper Section 5.2)
# Objective: In-distribution benchmarking of models trained at SIR = -20 dB and tested across 4 SIR levels (0, -10, -20, -30 dB).

experiment:
  id: "5b"
  name: "Same Data Distribution Benchmark"
  paper_section: "Section 5.2 (Pages 16-18)"
  replication_status: "BLOCKED (Faithful 640-slice benchmark) / PARTIALLY VIABLE (Proxy benchmark on 16 local RFI-Patch scenes)"

dataset:
  train_data_path: "data/lab_mat"                  # Full 640 laboratory slices from Baidu Netdisk (Missing locally)
  local_proxy_path: "Data/RFI-Patch/RFI-1"         # Local 16-stack subset available for proxy verification
  scene_split_file: "outputs/splits/exp2_split.json"
  split_identifiers:
    train_split: "train"                           # 80% scene holdout
    val_split: "val"                               # 10% scene holdout
    test_split: "test"                             # 10% scene holdout
  split_policy: "Strict scene-level holdout grouping all 4 SIR variants under the same scene ID"

models:
  evaluated:
    - "dncnn"
    - "pisnet"
    - "unet"
    - "fdnet"
  in_channels: 2
  out_channels: 2

dimensions:
  raw_image_shape: [512, 1500]
  stft_window_length: 187                          # L // 8 = 187
  stft_hop_length: 46                              # L // 32 = 46 (75% COLA overlap)
  stft_spectrogram_shape: [2, 187, 33]

training:
  batch_size: 4                                    # Section 4.3
  epochs: 100                                      # Section 4.3
  optimizer: "adamw"                               # Section 4.3
  lr: 0.0002                                       # Section 4.3
  weight_decay: 0.01                               # Section 4.3
  lr_scheduler: null
  loss: "auto"                                     # "mse" for dncnn/pisnet/unet; "fdnet" for fdnet
  seed: 42
  sir_settings:
    train_sir_db: [-20.0]                          # Section 5.2 explicitly trains at -20 dB SIR
    test_sir_db: [0.0, -10.0, -20.0, -30.0]        # Section 5.2 evaluates at four SIR levels

evaluation:
  metrics:
    - "psnr"                                       # Eq. 23
    - "ssim"                                       # Eq. 24
  quantize_8bit: true                              # Code-aligned with author's official evaluation script (A_test_fdnet.py)
  save_plots: true                                 # Figure 9 (PSNR vs SIR and SSIM vs SIR curves)
  save_visualizations: true                        # Figure 10 (Time-frequency) and Figure 11 (SAR images at -20 dB)
  target_results_figure_9_approx:
    sir_0db:
      psnr: "35-37 dB"
      ssim: "0.95-0.97"
    sir_minus10db:
      psnr: "31-33 dB"
      ssim: "0.90-0.93"
    sir_minus20db:
      psnr: "26-28 dB"
      ssim: "0.78-0.85"
    sir_minus30db:
      psnr: "18-22 dB (FDNet ~22 dB, others ~18-19 dB)"
      ssim: "0.50-0.65 (FDNet ~0.65, others ~0.50-0.55)"

output:
  output_dir: "outputs/experiments/exp_5b"
  checkpoints_dir: "outputs/runs/exp_5b"
