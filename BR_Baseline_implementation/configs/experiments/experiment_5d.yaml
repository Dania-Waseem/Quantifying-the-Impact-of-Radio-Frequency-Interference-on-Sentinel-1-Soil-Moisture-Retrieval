# Experiment 5D: Different Domains (Echo Domain vs Image Subspace) (Paper Section 5.4)
# Objective: Ablation study comparing RFI suppression performed in the proposed Image Subspace vs the traditional SAR Echo Domain.

experiment:
  id: "5d"
  name: "Echo Domain vs Image Subspace Comparison"
  paper_section: "Section 5.4 (Pages 19-20)"
  replication_status: "BLOCKED (Missing Core Components: raw radar echo simulator and SAR imaging processor omitted from paper and official code)"

dataset:
  train_data_path: "data/raw_echoes"               # Raw radar signal echo data (Absent from release and paper)
  test_data_path: "data/raw_echoes_test"           # Absent from release and paper
  split_identifiers:
    train_split: "train"
    val_split: "val"
    test_split: "test"

ablation_domains:
  domain_a: "Image Subspace (Proposed Method)"
  domain_b: "Echo Domain (Traditional Pipeline)"
  missing_components_documentation:
    - "No radar chirp simulator or raw echo dataset provided in official repository SAR-RFI-DATASET-main."
    - "No SAR imaging processor (Range Compression, RCMC, Azimuth Compression / Back-Projection) provided."
    - "Neural network architecture evaluated on echo domain is unstated in paper Section 5.4 (presumably FDNet)."
    - "Echo domain input dimensions and signal preprocessing are completely omitted."

models:
  evaluated:
    - "fdnet"                                      # Implied primary baseline in Section 5.4
  in_channels: 2
  out_channels: 2

training:
  batch_size: 4                                    # Standard Section 4.3 configuration
  epochs: 100                                      # Standard Section 4.3 configuration
  optimizer: "adamw"
  lr: 0.0002
  weight_decay: 0.01
  loss: "auto"
  seed: 42
  sir_settings:
    test_sir_db: [0.0, -10.0, -20.0, -30.0]        # Figure 14 evaluates across 4 SIR levels

evaluation:
  metrics:
    - "psnr"
    - "ssim"
  comparison_target_figure_14:
    sir_minus30db_delta:
      psnr_advantage: "+0.96 dB for Image Subspace over Echo Domain"
      ssim_advantage: "+0.06 for Image Subspace over Echo Domain"

output:
  output_dir: "outputs/experiments/exp_5d"
  checkpoints_dir: "outputs/runs/exp_5d"
