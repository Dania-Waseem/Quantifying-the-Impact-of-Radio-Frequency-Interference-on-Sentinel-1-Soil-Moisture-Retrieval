# Central configuration for the RFI and soil moisture study.
# All paths are relative to the repository root.

seed: 42            # master seed; every per-run seed is derived from it
n_seeds: 10         # number of repeated seeds per experimental setting
n_jobs: -1          # joblib workers (-1 uses all CPU cores)

paths:
  external: data/external
  raw_ismn: data/raw/ismn
  processed: data/processed
  models: models
  results: results
  # Aggregated results only (no per-station or per-row values); committed.
  results_aggregate: results/aggregate
  # Per-station and per-row results; kept local, never committed.
  results_private: results/private
  figures: figures
  diagrams: figures/diagrams
  docs: docs
  s1: data/external/s1_grd.csv
  ndvi: data/external/s2_ndvi.csv
  precip: data/external/era5_precip.csv
  static: data/external/static.csv
  ismn_sm: data/external/ismn_sm_0_5cm.csv   # a .csv.gz file is also accepted
  stations: data/raw/ismn/stations.csv
  matchups: data/processed/matchups.csv
  opensar_stats: data/processed/opensar_rfi_stats.csv

matchup:
  ismn_tolerance_minutes: 60   # nearest hourly ISMN value within this window
  ndvi_tolerance_days: 30      # nearest Sentinel-2 date within this window
  precip_windows_days: [7, 30] # antecedent sums over the days BEFORE the acquisition date
  # Minimum matchups per station. Fixed at 50 because the strict value of 100
  # leaves 0 OZNET stations (one orbit per station, 60-minute window), which
  # would remove the second sample. MIN_N = 75 is a Stage 4 robustness run.
  min_n: 50
  outlier_iqr_factor: 1.5      # outliers are flagged, never removed silently

# Row-level quality rules, applied after the matchup and before the MIN_N rule.
# Every removed row is written to results/screening_quality_removed.csv.
quality:
  drop_vv_equals_vh: true      # VV exactly equal to VH is an export error
  drop_negative_ndvi: true     # NDVI below 0 is invalid over these sites
  drop_zero_sm: true           # soil moisture of exactly 0 is a likely sensor fault
  vh_noise_floor_db: -30.0     # rows with VH below this are flagged (vh_low), not removed

samples:
  main: USCRN
  # OZNET has only about 50 to 80 matchups per station. It is used mainly as a
  # transfer test (train on USCRN, test on OZNET). Within-OZNET cross-validation
  # is also run but is flagged as small, with wide intervals.
  second: OZNET
  second_small_sample_flag: true

# Feature configurations. All are fixed before Stage 3 and every later stage
# (3, 4 and 5) is run and reported for all of them, side by side. No choice
# between them is made after seeing the results, and none is dropped. Any further configuration must be
# added here before it is run, and all runs are saved and reported.
feature_sets:
  F1:   # primary configuration: full feature set
    role: primary
    columns: [VV, VH, VHVV, angle, ndvi, p7, p30, elev, slope, doy]
  F2:   # second configuration: radar-reliant, precipitation (p7, p30) removed
    role: second
    columns: [VV, VH, VHVV, angle, ndvi, elev, slope, doy]
  F3:   # secondary configuration: relative backscatter, no site or rain features
    role: secondary
    columns: [rVV, rVH, VHVV, angle, ndvi, doy]
primary_feature_set: F1

# Relative backscatter used by F3: rVV = VV - ref(VV) and rVH = VH - ref(VH),
# where ref is a robust median of the station's own Sentinel-1 series (no soil
# moisture data is used). Robust median: take the median and the MAD of the
# series, drop values further than clip_mad scaled MADs from the median, and
# take the median of the remaining values.
# Under RFI injection (Stage 3) the reference is always computed from the
# series that the model actually receives, never from the clean values:
#   M1: the contaminated series; M3 and M4: the series after detect-and-fill;
#   M3b: the series after detect-and-discard. For the RFI-aware training of M4,
#   the reference of each injected training copy is computed from that copy
#   after detect-and-fill. In station-wise cross-validation the reference of a
#   test station comes from its own (observed) series only.
relative_backscatter:
  columns: [VV, VH]
  clip_mad: 3.0
  min_obs: 5        # fewer valid values than this gives a missing reference
target: sm

cv:
  n_folds: 5                   # station-wise GroupKFold

models:
  random_forest:
    n_estimators: 300
    min_samples_leaf: 3
  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
  change_detection:
    dry_percentile: 5
    wet_percentile: 95
    # Two scalings of the relative wetness to soil moisture, both reported:
    #   per_station (model "cd", primary): each station's relative wetness is
    #     standardised over its own series, then given the pooled training
    #     mean and, as spread, the median within-station standard deviation
    #     of soil moisture over the training stations;
    #   pooled (model "cd_pooled", original version): one mean and standard
    #     deviation matching over all training rows.
    scalings: [per_station, pooled]

# Statistical testing rules for Stage 4.
testing:
  multiple_testing: holm       # Holm correction across the hypothesis tests;
                               # corrected and uncorrected p-values are reported

# Injection grid. When data/processed/opensar_rfi_stats.csv exists, the
# severity and extent levels come from it:
#   * severity levels per polarisation: the listed percentiles of the measured
#     excess power C = severity_db_vv / severity_db_vh (dB), using only patches
#     with C above min_contrast_db in that polarisation; each level is
#     converted to SIR with SIR = -10 log10(10^(C/10) - 1), and each
#     polarisation is injected with its own SIR (the sir_db_* columns of the
#     file are not used: they hold a capped value for C <= 0.1 dB);
#   * extent levels: the listed percentiles of extent over all patches.
# The contamination probability p_c is not measured by OpenSAR (patch
# statistics do not give a per-acquisition rate); it remains an assumed range.
# The provisional lists below are used only if the file is absent (fallback,
# with a warning).
injection:
  opensar:
    percentiles: [10, 25, 50, 75, 90]
    min_contrast_db: 0.1
  p_c: [0.1, 0.25, 0.5]                # assumed, not from OpenSAR
  polarisation: [VV, VH, both]
  provisional_fallback:
    sir_db: [-5, 0, 5, 10, 15, 20]     # used only without the OpenSAR file
    extent: [0.1, 0.25, 0.5, 0.75, 1.0]

detection:
  window: 10        # w, past acquisitions of the same orbit (observed values)
  tau: 3.0          # robust z-score threshold
  tau_grid: [2.0, 2.5, 3.0, 3.5, 4.0]
  min_history: 5    # acquisitions needed before a z-score is computed
  one_sided: true   # flag only increases (RFI adds power, so it raises sigma0)
  mad_floor_db: 0.1 # lower bound on the scaled MAD, avoids division by ~0
  # Detection runs separately on VV and VH. Fill replaces only the flagged
  # polarisation; discard drops the acquisition if either is flagged.

fill:
  k: 5              # median of the previous k clean (unflagged) acquisitions

rfi_aware_training:
  mix_lambda: 0.5   # weight of injected copies relative to clean samples
  seed_offset: 100000  # training injection seeds differ from test seeds
  # The injected copy of the training fold draws, for each station, one
  # setting (SIR, extent, p_c, polarisation) uniformly from the injection grid,
  # then applies detect-and-fill, as M4 sees filled inputs at test time.

# Stage 3 experiment. Injection is applied to test inputs only. Models for
# M0, M1, M3 and M3b are the Stage 2 clean models. M2 is a placeholder (not
# implemented). M4 does not apply to the change-detection models (they have no
# trained component that could be made RFI-aware).
experiment:
  evaluations: [USCRN_cv, OZNET_cv, OZNET_transfer]
  variants: [M0, M1, M2, M3, M3b, M4]
  models: [rf, xgb, cd, cd_pooled]
  n_jobs: 4         # fewer workers than cores: each worker holds about 0.5 GB of models

stats:
  n_bootstrap: 5000
  alpha: 0.05
  ci_level: 0.95
  min_degradation: 1.0e-4   # guard for the recovery ratio G / D

# Robustness and sensitivity runs scheduled for Stage 4 (in addition to the
# alternative checks listed in the project plan).
robustness:
  min_n_check: 75              # USCRN restricted to stations with >= 75 matchups
  exclude_vh_low: true         # rerun without the rows flagged vh_low

# Stage 4 design, fixed before any Stage 4 result is computed.
# The station-level and row-level analyses need the errors of every station,
# so the listed scenarios are recomputed with the Stage 2 and M4 models (same
# splits, same seed streams as Stage 3) and their per-station error sums and
# row-level errors are kept locally (never committed).
stage4:
  # Reference scenario: the median severity level and the median extent level
  # of the injection grid (percentile labels), p_c = 0.25, both polarisations.
  reference: {severity_q: 50, extent_q: 50, p_c: 0.25, polarisation: both}
  # Dose-response sweeps around the reference (H1: severity, H2: extent).
  severity_sweep: true         # all grid SIR values at the reference extent, p_c, polarisation
  extent_sweep: true           # all grid extents at the reference SIR, p_c, polarisation
  polarisation_check: [VV, VH] # reference with one polarisation hit (moderation, alternative check)
  tau_check: true              # reference with every detection threshold in detection.tau_grid
  # Hypothesis verdicts use this evaluation and model; all other evaluations
  # and models are reported as well, with the same tests.
  primary_evaluation: USCRN_cv
  primary_model: rf
  # Ablation of M4 (one component removed at a time): M4 without fill is the
  # RFI-aware model applied to the unfilled contaminated input; M4 without
  # RFI-aware training is M3.
  ablations: [M4_nofill]
  # Evaluation subsets (no retraining; the same predictions restricted to rows
  # or stations): grassland (WorldCover 30), USCRN stations with >= 75
  # matchups, rows not flagged vh_low, NDVI terciles.
  subsets: [grassland, min_n_75, exclude_vh_low, ndvi_terciles]
  # Hypothesis tests (one family per evaluation, feature set and model, Holm):
  #   H1 severity slope > 0, H2 extent slope > 0 (one-sided Wilcoxon on
  #   station slopes); H3 primary mediation indirect effect (bootstrap);
  #   H4 RMSE_M3 < RMSE_M1 (one-sided Wilcoxon on station RMSE);
  #   H5 RMSE_M4 < RMSE_M3 (one-sided Wilcoxon); H6 NDVI and polarisation
  #   interaction terms (bootstrap, two-sided). H6 is supported if either
  #   interaction is significant after correction.
  learning_curve_sizes: [10, 20, 40, 60, 80, all]
  learning_curve_repeats: 50
  power_target: 0.8

# Case study (Stage 6 diagram 4): an irrigation-advice rule applied to the
# retrieved soil moisture. Advice is "irrigate" when soil moisture is below a
# threshold; the threshold is a quantile of the in situ soil moisture of the
# evaluation. Decisions from each variant are compared with the decision from
# the in situ value, at the reference scenario, for all rows and for the
# contaminated rows only. Fixed before the case study is computed.
case_study:
  evaluation: USCRN_cv
  feature_set: F1
  model: rf
  threshold_quantile: 0.3
  variants: [M0, M1, M3, M4]

# Follow-up experiments (exploratory), declared on 2026-11-22 after the main
# analysis (Stages 1 to 6) was complete. They do not replace any earlier
# result; their outputs are kept separately (results/aggregate/followup_*.csv,
# figures 15 to 17, notebook 07). They use the same splits, Stage 2 models and
# M4 models, and are run on F1, F2, F3 and the change-detection baselines.
# Their hypothesis tests form a separate Holm family per evaluation, feature
# set and model, and are reported as exploratory.
followup:
  n_seeds: 10
  # 1. Oracle mitigation: fill (M3_oracle), discard (M3b_oracle) and the
  #    RFI-aware model on oracle-filled input (M4_oracle) use the TRUE
  #    injection flags instead of the detector. Upper bound on recovery.
  #    Random contamination as in Stage 3 (same seed streams).
  oracle:
    severity_q: [10, 25, 50, 75, 90]
    extent_q: [10, 25, 50, 75, 90]
    p_c: 0.25
    polarisation: both
  # 2. Persistent RFI (fixed emitters): contamination that is not independent
  #    between acquisitions.
  #    block: one contiguous run of acquisitions covering the fraction p of
  #      each station's series (random start per station and seed);
  #    station: every acquisition of a random fraction p of the stations.
  persistent:
    modes: [block, station]
    fraction: [0.25, 0.5]
    severity_q: [50, 90]
    extent_q: [50, 90]
    polarisation: both
  # 3. Stress test beyond the OpenSAR P90: higher percentiles of the same
  #    OpenSAR statistics (100 = the largest observed value), random
  #    contamination. The breakpoint is the weakest setting at which the
  #    degradation D reaches the thresholds below.
  stress:
    severity_pct: [90, 95, 99, 100]
    extent_pct: [90, 95, 99, 100]
    p_c: [0.25, 0.5]
    polarisation: both
    breakpoint_relative_d: [0.05, 0.10]   # D as a share of the clean RMSE
  # Exploratory tests (one-sided Wilcoxon on station RMSE, Holm within the
  # follow-up family): oracle recovery RMSE_M1 > RMSE_M3_oracle and
  # RMSE_M1 > RMSE_M3b_oracle at the median and the P90 setting; degradation
  # RMSE_M1 > RMSE_M0 and detector recovery RMSE_M1 > RMSE_M3 for each
  # persistent setting at P90 severity and extent; degradation at the
  # strongest stress setting.

plots:
  dpi: 400
  diagram_dpi: 450              # 7.16 inch wide diagrams give about 3200 pixels
  single_column_in: 3.5
  double_column_in: 7.16

# Version 2 of the study (branch v2-improvements), declared on 2026-11-28
# before any v2 run. Gaps and questions are those of the approved proposal,
# unchanged. The v1 (pilot) results stay as they are; v2 outputs use new names
# (stage7_*, figures 18 and up, tables T12 and up).
v2_study:
  gaps:
    G1: "RFI research stops at the image. Studies judge detection or image quality, not what RFI and mitigation do to a product such as soil moisture."
    G2: "Soil moisture research assumes usable input. No study deliberately adds RFI to the input and measures the loss in accuracy."
    G3: "The effect of severity and extent is not measured for Sentinel-1 (only passive microwave evidence exists), nor how much mitigation recovers."
  research_questions:
    RQ1: "How does RFI contamination affect the accuracy of Sentinel-1 based soil moisture retrieval?"
    RQ2: "How does the loss in retrieval accuracy change with the severity and the spatial extent of RFI?"
    RQ3: "To what extent can RFI mitigation recover the retrieval performance lost to interference?"
    RQ4: "(optional) Does the impact differ across land cover types?"
  hypotheses:
    H1: {question: RQ2, name: dose response, statement: "For radar-reliant models (F2, F3, F4, change detection), error rises with RFI severity and extent."}
    H2: {question: RQ2, name: persistence, statement: "Persistent interferers (block and station modes) cause more damage than random hits."}
    H3: {question: RQ3, name: detection quality, statement: "A stronger, station-grouped detector recovers a positive, significant share of the damage and more than the rolling z-score detector."}
    H4: {question: RQ3, name: image to product, statement: "Image-domain suppression scaled by its measured power reduction (variant M2) recovers more accuracy than station-level fill (M3), and PSNR gain does not rank suppressors the same way as soil moisture recovery."}
    H5: {question: RQ1, name: decisions, statement: "RFI flips drought alerts (soil moisture below the 30th percentile) at a rate that RMSE alone does not show."}
    H6: {question: RQ4, name: land cover, optional: true, statement: "The damage differs between grassland and other land cover classes."}
  secondary:
    - "Old H3 (mediation), old H5 (RFI-aware training) and old H6 (moderation) are reported with their pilot outcomes, not as formal hypotheses."
  testing:
    multiple_testing: holm        # separate Holm family for the v2 tests
    family: v2
  # Stage 7 metrics on per-row predictions (conditional view and drought events).
  metrics:
    drought_quantile: 0.30        # alert when soil moisture is below the station's own 30th percentile of observed soil moisture
    n_bootstrap: 5000             # cluster bootstrap over stations
    flip_variants: [M1, M3, M3b, M4]
